name: Hindu datura
scientificName: Datura metel
group: plant
danger: 4
summary: >-
  A datura with large trumpet flowers, grown and naturalized widely in the tropics. Like
  jimsonweed, every part causes delirium.
exposure:
  routes: [eaten]
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
    - 'Islam T et al. Ethnobotanical uses and phytochemical, biological, and toxicological profiles of Datura metel L.: a review. Curr Res Toxicol 2023. https://doi.org/10.1016/j.crtox.2023.100106'
toxicParts:
  text: >-
    Every part of the plant, and the seeds especially.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
toxins:
  text: >-
    Tropane alkaloids: hyoscine (scopolamine), hyoscyamine, and atropine.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
    - 'Islam T et al. Ethnobotanical uses and phytochemical, biological, and toxicological profiles of Datura metel L.: a review. Curr Res Toxicol 2023. https://doi.org/10.1016/j.crtox.2023.100106'
symptoms:
  text: >-
    Dry mouth, flushed hot skin, wide pupils and blurred vision, a racing heart, and fever, with
    agitation, confusion, hallucinations, and seizures. Deaths are recorded from datura.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
onset:
  text: >-
    Usually within 30 to 60 minutes, lasting a day or two.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
atRisk:
  text: >-
    People who use it as a hallucinogen or remedy, and people given it in food or drink in order
    to rob them, as reported in India.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
    - 'Islam T et al. Ethnobotanical uses and phytochemical, biological, and toxicological profiles of Datura metel L.: a review. Curr Res Toxicol 2023. https://doi.org/10.1016/j.crtox.2023.100106'
habitat: >-
  Waste ground, roadsides, and villages.
size: Up to about 1.5 m tall
