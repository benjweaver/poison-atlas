name: Great barracuda
scientificName: Sphyraena barracuda
group: fish
danger: 3
summary: >-
  A large predatory fish of warm seas, sold as food, and among the fish most likely to carry
  ciguatera poison where reef algae produce it.
exposure:
  routes: [eaten]
  text: >-
    Only fish that have built up ciguatoxin from the reef food chain are poisonous, and they look,
    smell, and taste normal.
  sources:
    - 'Friedman MA et al. An updated review of ciguatera fish poisoning: clinical, epidemiological, environmental, and public health management. Mar Drugs 2017. https://doi.org/10.3390/md15030072'
    - 'Food poisoning from fish: ciguatera. Poison Control (National Capital Poison Center). https://www.poison.org/articles/food-poisoning-from-ciguatera'
toxicParts:
  text: >-
    The flesh of fish that carry ciguatoxin. Cooking and freezing don’t destroy it.
  sources:
    - 'Friedman MA et al. An updated review of ciguatera fish poisoning: clinical, epidemiological, environmental, and public health management. Mar Drugs 2017. https://doi.org/10.3390/md15030072'
    - 'Food poisoning from fish: ciguatera. Poison Control (National Capital Poison Center). https://www.poison.org/articles/food-poisoning-from-ciguatera'
toxins:
  text: >-
    Ciguatoxins, made by reef algae (Gambierdiscus) and concentrated up the food chain.
  sources:
    - 'Friedman MA et al. An updated review of ciguatera fish poisoning: clinical, epidemiological, environmental, and public health management. Mar Drugs 2017. https://doi.org/10.3390/md15030072'
    - 'Food poisoning from fish: ciguatera. Poison Control (National Capital Poison Center). https://www.poison.org/articles/food-poisoning-from-ciguatera'
symptoms:
  text: >-
    Nausea, vomiting, diarrhea, and stomach cramps, then numbness and tingling, itching, aching
    muscles and joints, and hot–cold reversal, where cold things feel burning. Symptoms can last
    weeks, months, or years; deaths are rare.
  sources:
    - 'Food poisoning from fish: ciguatera. Poison Control (National Capital Poison Center). https://www.poison.org/articles/food-poisoning-from-ciguatera'
    - 'Friedman MA et al. An updated review of ciguatera fish poisoning: clinical, epidemiological, environmental, and public health management. Mar Drugs 2017. https://doi.org/10.3390/md15030072'
onset:
  text: >-
    Usually within a few hours, and up to 24 hours after eating.
  sources:
    - 'Food poisoning from fish: ciguatera. Poison Control (National Capital Poison Center). https://www.poison.org/articles/food-poisoning-from-ciguatera'
    - 'Friedman MA et al. An updated review of ciguatera fish poisoning: clinical, epidemiological, environmental, and public health management. Mar Drugs 2017. https://doi.org/10.3390/md15030072'
atRisk:
  text: >-
    People who eat large reef fish from tropical and subtropical waters, and anyone they are
    shipped to. A woman fell ill 8 hours after eating barracuda on holiday in Aruba.
  sources:
    - 'Food poisoning from fish: ciguatera. Poison Control (National Capital Poison Center). https://www.poison.org/articles/food-poisoning-from-ciguatera'
    - 'Friedman MA et al. An updated review of ciguatera fish poisoning: clinical, epidemiological, environmental, and public health management. Mar Drugs 2017. https://doi.org/10.3390/md15030072'
habitat: >-
  Coral reefs, seagrass beds, and open coastal waters in the tropics and subtropics.
size: Up to about 2 m long
aquatic: marine
