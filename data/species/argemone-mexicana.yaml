name: Mexican prickly poppy
scientificName: Argemone mexicana
group: plant
danger: 4
summary: >-
  A spiny yellow-flowered poppy, a weed of fields across the tropics. Oil from its seeds, mixed
  into cooking oil, causes epidemic dropsy: swelling, heart failure, and blindness.
exposure:
  routes: [eaten]
  text: >-
    Poisonings come from edible oil, often mustard oil, contaminated with oil from its seeds.
  sources:
    - 'Sharma T, Brahma B, Laskar AAM, Paul J. Clinical profile and outcomes of epidemic dropsy patients attending a tertiary care centre in Assam, India. Cureus 2023. https://doi.org/10.7759/cureus.37408'
toxicParts:
  text: >-
    The oil in its seeds.
  sources:
    - 'Sharma T, Brahma B, Laskar AAM, Paul J. Clinical profile and outcomes of epidemic dropsy patients attending a tertiary care centre in Assam, India. Cureus 2023. https://doi.org/10.7759/cureus.37408'
toxins:
  text: >-
    Sanguinarine and dehydrosanguinarine, which make small blood vessels dilate and leak.
  sources:
    - 'Sharma T, Brahma B, Laskar AAM, Paul J. Clinical profile and outcomes of epidemic dropsy patients attending a tertiary care centre in Assam, India. Cureus 2023. https://doi.org/10.7759/cureus.37408'
symptoms:
  text: >-
    Swelling of both legs, skin changes, vomiting and diarrhea, a racing heart, and heart failure;
    glaucoma can cause blindness. In one hospital outbreak, 4 of 38 patients died.
  sources:
    - 'Sharma T, Brahma B, Laskar AAM, Paul J. Clinical profile and outcomes of epidemic dropsy patients attending a tertiary care centre in Assam, India. Cureus 2023. https://doi.org/10.7759/cureus.37408'
atRisk:
  text: >-
    Families and communities who cook with contaminated oil, mostly in India; outbreaks cluster in
    a single locality or family.
  sources:
    - 'Sharma T, Brahma B, Laskar AAM, Paul J. Clinical profile and outcomes of epidemic dropsy patients attending a tertiary care centre in Assam, India. Cureus 2023. https://doi.org/10.7759/cureus.37408'
habitat: >-
  Fields, roadsides, riverbanks, and waste ground.
size: Up to about 1 m tall
