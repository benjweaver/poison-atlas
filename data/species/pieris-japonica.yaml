name: Japanese andromeda
scientificName: Pieris japonica
group: plant
danger: 3
summary: >-
  An evergreen garden shrub from Japan with drooping sprays of white bell flowers. Like
  rhododendrons, it holds grayanotoxins, and tea made from it has poisoned people.
exposure:
  routes: [eaten]
  sources:
    - 'Jansen SA et al. Grayanotoxin poisoning: “mad honey disease” and beyond. Cardiovasc Toxicol 2012. https://doi.org/10.1007/s12012-012-9162-2'
toxicParts:
  text: >-
    Leaves, twigs, and flowers.
  sources:
    - 'Jansen SA et al. Grayanotoxin poisoning: “mad honey disease” and beyond. Cardiovasc Toxicol 2012. https://doi.org/10.1007/s12012-012-9162-2'
toxins:
  text: >-
    Grayanotoxins, which keep nerve sodium channels open and slow the heart.
  sources:
    - 'Jansen SA et al. Grayanotoxin poisoning: “mad honey disease” and beyond. Cardiovasc Toxicol 2012. https://doi.org/10.1007/s12012-012-9162-2'
symptoms:
  text: >-
    Vomiting, a slow heart, low blood pressure, blurred vision, and seizures.
  sources:
    - 'Jansen SA et al. Grayanotoxin poisoning: “mad honey disease” and beyond. Cardiovasc Toxicol 2012. https://doi.org/10.1007/s12012-012-9162-2'
atRisk:
  text: >-
    Small children who eat the garden plant, and adults who make tea from it: a 76-year-old man
    had a seizure after drinking it, and a 21-month-old girl’s heart slowed to 40 beats a minute.
  sources:
    - 'Jansen SA et al. Grayanotoxin poisoning: “mad honey disease” and beyond. Cardiovasc Toxicol 2012. https://doi.org/10.1007/s12012-012-9162-2'
animals:
  who: [livestock]
  text: >-
    Cattle, sheep, and goats are poisoned by grayanotoxin plants such as Pieris.
  sources:
    - 'Jansen SA et al. Grayanotoxin poisoning: “mad honey disease” and beyond. Cardiovasc Toxicol 2012. https://doi.org/10.1007/s12012-012-9162-2'
habitat: >-
  Mountain thickets and woods; widely planted in gardens.
size: A shrub up to about 4 m tall
