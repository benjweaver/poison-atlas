gbif:
  include:
    - code: EG
      reason: 'native on Egypt’s Red Sea coast, as well as introduced on its Mediterranean one'
      source: 'Ulman et al. Assessment of human health impacts from invasive pufferfish (attacks, poisonings and fatalities) across the Eastern Mediterranean. Biology 2024. https://doi.org/10.3390/biology13040208'
    - code: PS
      introduced: true
      reason: 'Gaza’s coast is on the Mediterranean, which it entered through the Suez Canal'
      source: 'Ulman et al. Assessment of human health impacts from invasive pufferfish (attacks, poisonings and fatalities) across the Eastern Mediterranean. Biology 2024. https://doi.org/10.3390/biology13040208'
  exclude:
    - code: FO
      reason: 'outside its range (Indo-West Pacific, and the Mediterranean through the Suez Canal)'
      source: 'Lagocephalus sceleratus: silver-cheeked toadfish. FishBase. https://www.fishbase.se/summary/Lagocephalus-sceleratus.html'
