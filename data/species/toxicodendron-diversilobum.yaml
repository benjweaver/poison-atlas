name: Pacific poison oak
scientificName: Toxicodendron diversilobum
group: plant
danger: 2
summary: >-
  A shrub or climbing vine of western North America with leaves in threes. Like poison ivy, its
  oil causes a blistering rash.
exposure:
  routes: [skin, inhaled]
  text: >-
    Burning it releases the oil in smoke, which can cause severe breathing problems.
  sources:
    - 'Poison ivy, poison oak, and poison sumac. Poison Control (National Capital Poison Center). https://www.poison.org/articles/poison-ivy-oak-and-sumac'
toxicParts:
  text: >-
    Every part, especially the leaves and stems, even dried or dead.
  sources:
    - 'Poison ivy, poison oak, and poison sumac. Poison Control (National Capital Poison Center). https://www.poison.org/articles/poison-ivy-oak-and-sumac'
toxins:
  text: >-
    Urushiol, an oil that triggers an allergic reaction in the skin.
  sources:
    - 'Poison ivy, poison oak, and poison sumac. Poison Control (National Capital Poison Center). https://www.poison.org/articles/poison-ivy-oak-and-sumac'
symptoms:
  text: >-
    An itchy red rash that can blister and itch for days or weeks. Severe cases need medical care.
  sources:
    - 'Poison ivy, poison oak, and poison sumac. Poison Control (National Capital Poison Center). https://www.poison.org/articles/poison-ivy-oak-and-sumac'
onset:
  text: >-
    Often 1 to 2 days after contact, and sometimes up to a week.
  sources:
    - 'Poison ivy, poison oak, and poison sumac. Poison Control (National Capital Poison Center). https://www.poison.org/articles/poison-ivy-oak-and-sumac'
atRisk:
  text: >-
    Anyone working or walking outdoors: gardeners, hikers, and campers. The oil also spreads from
    clothes, tools, and pets.
  sources:
    - 'Poison ivy, poison oak, and poison sumac. Poison Control (National Capital Poison Center). https://www.poison.org/articles/poison-ivy-oak-and-sumac'
habitat: >-
  Woods, chaparral, oak woodland, and canyons.
regions:
  - CA-BC
  - MX-BCN
  - US-CA
  - US-NV
  - US-OR
  - US-WA
