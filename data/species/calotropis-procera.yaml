name: Sodom apple
scientificName: Calotropis procera
group: plant
danger: 2
summary: >-
  A milkweed shrub of dry wasteland in Africa and Asia, full of milky latex. Latex in the eye
  clouds the cornea and blurs vision.
exposure:
  routes: [eyes]
  sources:
    - 'Basak SK et al. Ocular toxicity by latex of Calotropis procera (Sodom apple). Indian J Ophthalmol 2009. https://doi.org/10.4103/0301-4738.49402'
toxicParts:
  text: >-
    The milky latex, found throughout the plant.
  sources:
    - 'Basak SK et al. Ocular toxicity by latex of Calotropis procera (Sodom apple). Indian J Ophthalmol 2009. https://doi.org/10.4103/0301-4738.49402'
toxins:
  text: >-
    Irritants in the latex; the long-term effect on the cornea is not yet known.
  sources:
    - 'Basak SK et al. Ocular toxicity by latex of Calotropis procera (Sodom apple). Indian J Ophthalmol 2009. https://doi.org/10.4103/0301-4738.49402'
symptoms:
  text: >-
    Sudden, painless dimming of vision with sensitivity to light, a red eye, and a swollen cornea;
    some eyes develop inflammation inside or raised pressure (glaucoma).
  sources:
    - 'Basak SK et al. Ocular toxicity by latex of Calotropis procera (Sodom apple). Indian J Ophthalmol 2009. https://doi.org/10.4103/0301-4738.49402'
atRisk:
  text: >-
    People who pick its flowers and leaves, which are used in worship in India, or who get latex
    on their hands and touch their eyes.
  sources:
    - 'Basak SK et al. Ocular toxicity by latex of Calotropis procera (Sodom apple). Indian J Ophthalmol 2009. https://doi.org/10.4103/0301-4738.49402'
habitat: >-
  Wasteland, roadsides, and dry, sandy ground.
size: A shrub or small tree up to about 5 m tall
