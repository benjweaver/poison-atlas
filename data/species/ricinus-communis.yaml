name: Castor oil plant
scientificName: Ricinus communis
group: plant
danger: 4
summary: >-
  A fast-growing shrub grown in gardens and gone wild across the tropics. Its mottled seeds,
  castor beans, hold ricin, one of the most toxic substances known.
exposure:
  routes: [eaten]
  text: >-
    The seeds are dangerous when chewed or crushed; their hard coat keeps the ricin in when they
    are swallowed whole.
  sources:
    - 'What happens if I eat castor beans? Poison Control (National Capital Poison Center). https://www.poison.org/articles/what-happens-if-i-eat-castor-beans-222'
    - 'O’Malley GF, O’Malley R. Plant poisoning. MSD Manual Professional Edition, 2025. https://www.msdmanuals.com/professional/injuries-poisoning/poisoning/plant-poisoning'
toxicParts:
  text: >-
    The seeds (castor beans). Castor oil, though pressed from them, has no ricin in it.
  sources:
    - 'What happens if I eat castor beans? Poison Control (National Capital Poison Center). https://www.poison.org/articles/what-happens-if-i-eat-castor-beans-222'
toxins:
  text: >-
    Ricin, a protein that stops cells from making the proteins they need to live.
  sources:
    - 'What happens if I eat castor beans? Poison Control (National Capital Poison Center). https://www.poison.org/articles/what-happens-if-i-eat-castor-beans-222'
    - 'O’Malley GF, O’Malley R. Plant poisoning. MSD Manual Professional Edition, 2025. https://www.msdmanuals.com/professional/injuries-poisoning/poisoning/plant-poisoning'
symptoms:
  text: >-
    Nausea, vomiting, diarrhea, and stomach pain, which can become bleeding from the gut. Losing
    fluid can lead to shock, and the liver, kidneys, and brain can fail.
  sources:
    - 'What happens if I eat castor beans? Poison Control (National Capital Poison Center). https://www.poison.org/articles/what-happens-if-i-eat-castor-beans-222'
    - 'O’Malley GF, O’Malley R. Plant poisoning. MSD Manual Professional Edition, 2025. https://www.msdmanuals.com/professional/injuries-poisoning/poisoning/plant-poisoning'
onset:
  text: >-
    Gut symptoms can be delayed, and are followed by damage to other organs.
  delayed: true
  sources:
    - 'O’Malley GF, O’Malley R. Plant poisoning. MSD Manual Professional Edition, 2025. https://www.msdmanuals.com/professional/injuries-poisoning/poisoning/plant-poisoning'
atRisk:
  text: >-
    Children, since one chewed seed is thought to be enough to seriously harm a child, and anyone
    who takes the seeds as a remedy. The seeds are also used in jewelry.
  sources:
    - 'What happens if I eat castor beans? Poison Control (National Capital Poison Center). https://www.poison.org/articles/what-happens-if-i-eat-castor-beans-222'
animals:
  who: [dogs, cats, horses]
  text: >-
    Pets often reach it through garden plants or pruned foliage.
  sources:
    - 'Castor bean plant. ASPCA Animal Poison Control. https://www.aspca.org/pet-care/aspca-poison-control/toxic-and-non-toxic-plants/castor-bean-plant'
habitat: >-
  Disturbed ground, roadsides, and riverbanks in warm climates, and gardens.
size: A shrub or small tree, usually 2 to 4 m tall
