name: Black locust
scientificName: Robinia pseudoacacia
group: plant
danger: 2
summary: >-
  A thorny tree of the eastern United States with drooping white flowers, planted and gone wild
  widely. Its bark, seeds, and leaves hold protein toxins related to ricin.
exposure:
  routes: [eaten, skin]
  text: >-
    Punctures from its thorns have also caused serious local injury.
  sources:
    - 'Are black locust trees toxic? Poison Control (National Capital Poison Center). https://www.poison.org/articles/are-black-locust-trees-toxic-221'
toxicParts:
  text: >-
    The bark, seeds, and leaves; the flowers appear nontoxic or much less toxic.
  sources:
    - 'Are black locust trees toxic? Poison Control (National Capital Poison Center). https://www.poison.org/articles/are-black-locust-trees-toxic-221'
toxins:
  text: >-
    Toxalbumins (robin and phasin), which stop cells making proteins.
  sources:
    - 'Are black locust trees toxic? Poison Control (National Capital Poison Center). https://www.poison.org/articles/are-black-locust-trees-toxic-221'
symptoms:
  text: >-
    Nausea, vomiting, weakness, flushing, and lethargy; rarely liver injury and seizures. Thorn
    punctures can cause pain, swelling, and, rarely, tissue death.
  sources:
    - 'Are black locust trees toxic? Poison Control (National Capital Poison Center). https://www.poison.org/articles/are-black-locust-trees-toxic-221'
onset:
  text: >-
    Stomach symptoms usually within 6 hours of eating it.
  sources:
    - 'Are black locust trees toxic? Poison Control (National Capital Poison Center). https://www.poison.org/articles/are-black-locust-trees-toxic-221'
atRisk:
  text: >-
    Young children who chew the bark or eat the seeds.
  sources:
    - 'Are black locust trees toxic? Poison Control (National Capital Poison Center). https://www.poison.org/articles/are-black-locust-trees-toxic-221'
animals:
  who: [horses]
  text: >-
    Horses have become severely ill or died after eating it.
  sources:
    - 'Are black locust trees toxic? Poison Control (National Capital Poison Center). https://www.poison.org/articles/are-black-locust-trees-toxic-221'
habitat: >-
  Woodland edges, old fields, roadsides, and disturbed ground.
size: A tree up to about 25 m tall
