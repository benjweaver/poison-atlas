name: Jimsonweed
scientificName: Datura stramonium
group: plant
danger: 4
summary: >-
  A rank-smelling weed with white or purple trumpet flowers and spiny seed pods. Every part causes
  delirium, and its seeds most of all.
exposure:
  routes: [eaten, eyes]
  text: >-
    Sap in the eye can widen the pupil, sometimes of that eye only.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
toxicParts:
  text: >-
    Every part of the plant, and the seeds especially. Neither drying nor boiling destroys the
    toxins.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
    - 'Disel et al. Poisoned after dinner: dolma with Datura stramonium. Turk J Emerg Med 2016. https://doi.org/10.5505/1304.7361.2015.70894'
toxins:
  text: >-
    Tropane alkaloids: hyoscine (scopolamine), hyoscyamine, and atropine, which block the nervous
    system’s acetylcholine signals.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
    - 'Disel et al. Poisoned after dinner: dolma with Datura stramonium. Turk J Emerg Med 2016. https://doi.org/10.5505/1304.7361.2015.70894'
symptoms:
  text: >-
    Dry mouth, flushed hot skin, wide pupils and blurred vision, a racing heart, and fever, with
    agitation, confusion, hallucinations, and seizures. Deaths are recorded.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
    - 'Disel et al. Poisoned after dinner: dolma with Datura stramonium. Turk J Emerg Med 2016. https://doi.org/10.5505/1304.7361.2015.70894'
    - 'O’Malley GF, O’Malley R. Plant poisoning. MSD Manual Professional Edition, 2025. https://www.msdmanuals.com/professional/injuries-poisoning/poisoning/plant-poisoning'
onset:
  text: >-
    Usually within 30 to 60 minutes, lasting a day or two, as the toxins slow the gut.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
atRisk:
  text: >-
    People who take it for hallucinations, cooks who use its flowers or leaves by mistake, and
    people given it in food or drink in order to rob them.
  sources:
    - 'Pillay VV, Sasidharan A. Oleander and Datura poisoning: an update. Indian J Crit Care Med 2019;23(Suppl 4):S250–S255. https://doi.org/10.5005/jp-journals-10071-23302'
    - 'Disel et al. Poisoned after dinner: dolma with Datura stramonium. Turk J Emerg Med 2016. https://doi.org/10.5505/1304.7361.2015.70894'
lookalikes:
  - name: Spinach
    scientificName: Spinacia oleracea
    note: >-
      Datura can be mistaken for spinach; two of the most severe food mix-ups in southeastern France were with datura.
    sources:
      - 'Torrents R et al. Food confusion between edible and poisonous plants: a 22-year retrospective of the Southeastern France Poison Control Center. Toxins 2024. https://doi.org/10.3390/toxins16120552'
habitat: >-
  Waste ground, farmland, roadsides, and field edges.
size: Up to about 1.5 m tall
