name: Birthwort
scientificName: Aristolochia clematitis
group: plant
danger: 4
summary: >-
  A weed of vineyards and fields in southern and central Europe. Its aristolochic acid causes
  progressive kidney failure and cancer, and is behind Balkan endemic nephropathy.
exposure:
  routes: [eaten]
  text: >-
    Poisoning is slow: people are exposed over years, through food contaminated by the plant or
    through herbal remedies.
  sources:
    - 'Brzić I et al. Different ecological niches of poisonous Aristolochia clematitis in central and marginal distribution ranges: another contribution to a better understanding of Balkan endemic nephropathy. Plants 2023. https://doi.org/10.3390/plants12173022'
    - 'Ham YH et al. Positive feedback mechanism in aristolochic acid I exposure-induced anemia and DNA adduct formation: implications for Balkan endemic nephropathy. J Agric Food Chem 2024 (abstract). https://doi.org/10.1021/acs.jafc.4c03508'
toxicParts:
  text: >-
    The plant, used as a medicine since antiquity and now banned for medical use.
  sources:
    - 'Brzić I et al. Different ecological niches of poisonous Aristolochia clematitis in central and marginal distribution ranges: another contribution to a better understanding of Balkan endemic nephropathy. Plants 2023. https://doi.org/10.3390/plants12173022'
toxins:
  text: >-
    Aristolochic acids, which damage the kidneys and DNA; aristolochic acid is classified as a
    human carcinogen.
  sources:
    - 'Brzić I et al. Different ecological niches of poisonous Aristolochia clematitis in central and marginal distribution ranges: another contribution to a better understanding of Balkan endemic nephropathy. Plants 2023. https://doi.org/10.3390/plants12173022'
    - 'Ham YH et al. Positive feedback mechanism in aristolochic acid I exposure-induced anemia and DNA adduct formation: implications for Balkan endemic nephropathy. J Agric Food Chem 2024 (abstract). https://doi.org/10.1021/acs.jafc.4c03508'
symptoms:
  text: >-
    Chronic kidney disease that progresses to kidney failure, with anemia and cancers of the
    urinary tract.
  sources:
    - 'Brzić I et al. Different ecological niches of poisonous Aristolochia clematitis in central and marginal distribution ranges: another contribution to a better understanding of Balkan endemic nephropathy. Plants 2023. https://doi.org/10.3390/plants12173022'
    - 'Ham YH et al. Positive feedback mechanism in aristolochic acid I exposure-induced anemia and DNA adduct formation: implications for Balkan endemic nephropathy. J Agric Food Chem 2024 (abstract). https://doi.org/10.1021/acs.jafc.4c03508'
    - 'O’Malley GF, O’Malley R. Plant poisoning. MSD Manual Professional Edition, 2025. https://www.msdmanuals.com/professional/injuries-poisoning/poisoning/plant-poisoning'
onset:
  text: >-
    Very slow: kidney disease develops over years of exposure.
  delayed: true
  sources:
    - 'Ham YH et al. Positive feedback mechanism in aristolochic acid I exposure-induced anemia and DNA adduct formation: implications for Balkan endemic nephropathy. J Agric Food Chem 2024 (abstract). https://doi.org/10.1021/acs.jafc.4c03508'
    - 'Brzić I et al. Different ecological niches of poisonous Aristolochia clematitis in central and marginal distribution ranges: another contribution to a better understanding of Balkan endemic nephropathy. Plants 2023. https://doi.org/10.3390/plants12173022'
atRisk:
  text: >-
    Rural farming villages along tributaries of the Danube in Bosnia and Herzegovina, Bulgaria,
    Croatia, Romania, and Serbia, where dietary exposure causes Balkan endemic nephropathy.
  sources:
    - 'Brzić I et al. Different ecological niches of poisonous Aristolochia clematitis in central and marginal distribution ranges: another contribution to a better understanding of Balkan endemic nephropathy. Plants 2023. https://doi.org/10.3390/plants12173022'
    - 'Ham YH et al. Positive feedback mechanism in aristolochic acid I exposure-induced anemia and DNA adduct formation: implications for Balkan endemic nephropathy. J Agric Food Chem 2024 (abstract). https://doi.org/10.1021/acs.jafc.4c03508'
habitat: >-
  Vineyards, field edges, floodplain woods, and warm, sunny, disturbed ground.
size: Up to about 1 m tall
